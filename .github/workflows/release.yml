name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  validation:
    uses: ./.github/workflows/validate.yml

  release:
    needs:
      - tests
      - validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version
        shell: bash
        run: |
          manifest_version="$(jq -r '.version' custom_components/hisense_b544/manifest.json)"
          project_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [[ "$GITHUB_REF_NAME" != "v$manifest_version" || "$manifest_version" != "$project_version" ]]; then
            echo "Tag $GITHUB_REF_NAME, manifest $manifest_version, and project $project_version do not match." >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
